# Aptimizer — full stack. `docker compose up -d` brings up Mongo, the API and the web app.
#
#   Local / LAN:  open http://localhost           (no TLS, no domain needed)
#   Public VPS:   uncomment the caddy service and set DOMAIN in .env for automatic HTTPS
#
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Not published to the host: only the backend needs to reach it. Publishing
    # 27017 on a public VPS is how Mongo instances get found and wiped.
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides .env so the container talks to the mongo service, not localhost.
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-aptimizer}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

  # Automatic HTTPS for a real domain. Uncomment, point your DNS A record at the
  # server, set DOMAIN and LETSENCRYPT_EMAIL in .env, and change the frontend
  # service to `expose: ["80"]` instead of publishing a port.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   environment:
  #     DOMAIN: ${DOMAIN}
  #     LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
  #   depends_on:
  #     - frontend

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
